<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, user-scalable=no" />
        <title>WebGL Ping Pong by @MortimerGoro</title>
        
        <script type="text/javascript" src="lib/three.min.js"></script>
        <script type="text/javascript" src="src/physics.js"></script>
        <script type="text/javascript" src="src/AI.js"></script>
        <script type="text/javascript" src="src/audio.js"></script>
        <script type="text/javascript" src="src/pingpong.js"></script>
        <script type="text/javascript" src="src/main.js"></script>

        <!-- 简单 HUD 样式 -->
        <style>
            #hud {
                position: fixed;
                top: 10px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 10;
                color: #ffffff;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                text-align: center;
                pointer-events: none; /* 不挡鼠标 */
            }

            #scoreboard {
                display: inline-flex;
                align-items: baseline;
                gap: 8px;
                padding: 6px 12px;
                border-radius: 999px;
                background: rgba(0, 0, 0, 0.45);
                font-weight: 600;
                font-size: 18px;
            }

            #scoreboard .label {
                font-size: 13px;
                opacity: 0.9;
                text-transform: uppercase;
                letter-spacing: 0.08em;
            }

            #scoreboard .score {
                font-size: 20px;
                min-width: 22px;
                text-align: center;
            }

            #scoreboard .sep {
                opacity: 0.8;
            }

            #status-text {
                margin-top: 6px;
                font-size: 12px;
                opacity: 0.9;
                text-shadow: 0 0 4px rgba(0, 0, 0, 0.7);
            }
        </style>
    </head>
    
    <body style="position:absolute;padding:0;margin:0;width:100%;height:100%">
        <div id="container"></div>

        <!-- HUD 覆盖层 -->
        <div id="hud">
            <div id="scoreboard">
                <span class="label">Player</span>
                <span id="player-score" class="score">0</span>
                <span class="sep">:</span>
                <span id="ai-score" class="score">0</span>
                <span class="label">AI</span>
            </div>
            <div id="status-text">
                Click / tap to serve, move to control the paddle.
            </div>
        </div>
    </body>
</html>
